name: 이지랩 헬스체크

on:
  schedule:
    - cron: '17,47 * * * *'  # 매시 17·47분 (30분 주기, 48회/일) — 정시(:00/:30) 러시 회피로 드랍·지연 최소화, 장애 최대 ~30분 내 감지
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  issues: write

# 수동 실행이 스케줄 실행과 겹칠 때 gh-pages 통계 파일이 서로 덮어쓰는 race 방지 — 순차 실행
concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      HEALTH_STATUS: ''
      # 운영 런 = main 브랜치의 정기 스케줄만. 브랜치 푸시·수동 실행은 전부 '검증 런'이다.
      # 검증 런이 운영 상태 이력·Pages·Slack·이슈를 갱신하면 오탐 알림과 통계 왜곡이 생긴다
      # (실제로 브랜치 검증 런이 statuses.json 에 FAIL 로 쌓여 '간헐 불안정' 알림이 발송됐다).
      IS_PRODUCTION_RUN: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 패키지 설치
        run: npm ci

      # 타입 오류를 30분짜리 런타임이 아니라 여기서 즉시 잡는다 (브라우저 설치·테스트 전 빠른 실패)
      - name: 타입 체크 (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Playwright 브라우저 설치 (Chromium)
        run: npx playwright install --with-deps chromium

      # 판정 규칙 테스트 — 운영 서버를 때리지 않고 수초에 끝난다.
      # 여기서 실패하면 헬스체크 결과를 신뢰할 수 없으므로 continue-on-error 없이 즉시 중단한다.
      - name: 판정 규칙 테스트 (운영 무관)
        run: |
          npx playwright test tests/judgment.spec.ts
          python3 scripts/test_fail_streak.py
          python3 scripts/test_dashboard_metrics.py

      - name: 테스트 실행
        run: npx playwright test tests/ezlab.spec.ts
        continue-on-error: true

      - name: 실행별 리포트 저장 및 인덱스 생성
        env:
          TZ: Asia/Seoul
        run: |
          DATETIME=$(date +'%Y-%m-%d_%H-%M')
          echo "RUN_DATETIME=$DATETIME" >> $GITHUB_ENV

          mkdir -p reports/$DATETIME
          cp -r playwright-report/. reports/$DATETIME/
          cp report-status.json reports/$DATETIME/status.json 2>/dev/null || echo '{"status":"UNKNOWN","passCount":0,"failCount":0,"warnCount":0,"serverTimes":{}}' > reports/$DATETIME/status.json

          git fetch origin gh-pages 2>/dev/null || true
          git ls-tree --name-only origin/gh-pages 2>/dev/null \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}$' > /tmp/runs.txt || true
          echo "$DATETIME" >> /tmp/runs.txt
          sort -r /tmp/runs.txt | uniq | head -500 > /tmp/all_runs.txt

          git show origin/gh-pages:statuses.json > /tmp/statuses.json 2>/dev/null || echo '{}' > /tmp/statuses.json
          git show origin/gh-pages:perf-history.json > /tmp/perf-history.json 2>/dev/null || echo '{}' > /tmp/perf-history.json
          git show origin/gh-pages:monthly-stats.json > /tmp/monthly-stats.json 2>/dev/null || echo '{}' > /tmp/monthly-stats.json
          git show origin/gh-pages:daily-stats.json > /tmp/daily-stats.json 2>/dev/null || echo '{}' > /tmp/daily-stats.json
          git show origin/gh-pages:failures-history.json > /tmp/failures-history.json 2>/dev/null || echo '{}' > /tmp/failures-history.json
          # 런별 점검 완주 여부 — 대시보드의 서비스 가용률·완주율·열린 품질 경고가 이걸 쓴다.
          # 없으면 WARN 이 전부 '확인 불가'로 잡힌다(완주 여부를 모르면 가용을 주장하지 않는다).
          git show origin/gh-pages:coverage.json > /tmp/coverage.json 2>/dev/null || echo '{}' > /tmp/coverage.json

          CURRENT_STATUS=$(python3 -c "import json; d=json.load(open('report-status.json')); print(d.get('status','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")
          echo "HEALTH_STATUS=$CURRENT_STATUS" >> $GITHUB_ENV

          # 직전 런 상태 (update_statuses 전 /tmp/statuses.json 최신 키) → Slack 전환 알림용
          PREV_STATUS=$(python3 -c "import json; d=json.load(open('/tmp/statuses.json')); ks=sorted(d,reverse=True); print(d[ks[0]] if ks else 'NONE')" 2>/dev/null || echo "NONE")
          echo "PREV_STATUS=$PREV_STATUS" >> $GITHUB_ENV

          # 최근 상태 이력 (현재 런 제외, 최신→과거 10개) → Slack 디바운스(단발 blip 억제)·불안정(flapping) 판정용
          RECENT_STATUSES=$(python3 -c "import json; d=json.load(open('/tmp/statuses.json')); ks=sorted(d,reverse=True)[:10]; print(','.join(d[k] for k in ks))" 2>/dev/null || echo "")
          echo "RECENT_STATUSES=$RECENT_STATUSES" >> $GITHUB_ENV

          # 상태 이력·집계는 운영 런에서만 갱신한다 — 검증 런이 섞이면 가동률과 알림 판정이 왜곡된다.
          if [ "$IS_PRODUCTION_RUN" = "true" ]; then
            COVERAGE=$(python3 -c "import json; print(str(json.load(open('report-status.json')).get('coverageComplete','')).lower())" 2>/dev/null || echo "")
            python3 scripts/update_statuses.py "$DATETIME" "$CURRENT_STATUS" "$COVERAGE"
            python3 scripts/update_perf.py "$DATETIME"
            python3 scripts/update_failures.py "$DATETIME"
          else
            echo "검증 런 — 상태 이력·집계 갱신 건너뜀 (statuses/perf/failures)"
          fi

          # 이슈 생성 디바운스용 연속 FAIL 스트릭 — Slack 알림과 반드시 같은 기준이어야 해서
          # scripts/fail_streak.py 하나를 공유한다(횟수 + 장애 지문 누적 교집합).
          # 지문을 안 보면 서로 다른 단발 오류 A→B 도 '연속 2회'가 돼 이슈가 생성된다.
          # update_failures.py 뒤에서 계산해야 notify_slack.py 가 보는 이력과 동일해진다.
          # UNKNOWN(테스트 미완주=인프라 이상)은 별도 즉시 알림 경로가 있어 사이트 장애 스트릭에 섞지 않는다.
          FAIL_STREAK=$(python3 scripts/fail_streak.py "$CURRENT_STATUS" "$DATETIME" "$RECENT_STATUSES" 2>/dev/null || echo 0)
          echo "FAIL_STREAK=$FAIL_STREAK" >> $GITHUB_ENV

          cp /tmp/statuses.json reports/statuses.json
          cp /tmp/coverage.json reports/coverage.json 2>/dev/null || true
          cp /tmp/perf-history.json reports/perf-history.json
          cp /tmp/monthly-stats.json reports/monthly-stats.json
          cp /tmp/daily-stats.json reports/daily-stats.json
          cp /tmp/failures-history.json reports/failures-history.json

          # 롤링 백업: 집계 파일은 루트에 단일본만 있어 손상/유실 시 복구 불가(120일 지난 월은 폴더도 없어 백필 불가).
          # 보존되는 이번 런 폴더에 스냅샷을 남겨 최근 120일치 복구 지점을 확보한다(폴더가 prune되면 함께 정리됨).
          cp /tmp/monthly-stats.json /tmp/daily-stats.json reports/$DATETIME/

          python3 scripts/generate_index.py /tmp/all_runs.txt "$DATETIME" /tmp/statuses.json /tmp/perf-history.json /tmp/monthly-stats.json /tmp/daily-stats.json /tmp/failures-history.json reports/index.html /tmp/coverage.json

      - name: 대용량 파일 제거 (GitHub 100MB 제한 대응)
        run: find reports -name "*.zip" -size +50M -delete

      - name: GitHub Pages 배포
        if: env.IS_PRODUCTION_RUN == 'true'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f  # v4.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: reports
          clean: false

      - name: 오래된 리포트 폴더 정리 (120일 경과 · 용량 방어)
        if: env.IS_PRODUCTION_RUN == 'true'
        continue-on-error: true
        run: python3 scripts/prune_old_reports.py

      - name: Slack 알림 (장애 발생 / 실행 실패 / 복구 전환 시)
        # UNKNOWN = 테스트 미완주(결과 파일 미생성) — 사이트가 아니라 헬스체크 자체의 이상이므로 반드시 알림
        # 검증 런(브랜치·수동)은 알림 대상이 아니다 — 오탐이 채널로 나간다.
        if: env.IS_PRODUCTION_RUN == 'true' && (env.HEALTH_STATUS == 'FAIL' || env.HEALTH_STATUS == 'UNKNOWN' || env.PREV_STATUS == 'FAIL' || env.PREV_STATUS == 'UNKNOWN')
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/notify_slack.py

      - name: 실패 알림 (GitHub Issue 자동 생성)
        # Slack과 동일하게 연속 2런(FAIL_STREAK >= 2)부터 생성 — 단발 blip이 이슈/코멘트 스팸을 만들지 않도록.
        # (기준값 2는 notify_slack.py의 FAIL_ALERT_THRESHOLD 기본값과 맞춰야 함)
        if: env.IS_PRODUCTION_RUN == 'true' && env.HEALTH_STATUS == 'FAIL' && env.FAIL_STREAK >= 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          FAIL_TIME=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')
          ISSUE_LABEL="healthcheck-fail"
          # 중복 이슈 판별을 '제목 전문검색'이 아니라 '고정 라벨'로 한다.
          # GitHub 이슈 검색은 한글(CJK) 토크나이즈가 불안정해, 열린 이슈가 있는데도 검색이
          # 빈 결과를 주면 30분마다 새 이슈가 생성되는 스팸이 났다 → 라벨 기반은 결정적으로 매칭된다.
          gh label create "$ISSUE_LABEL" --color B60205 --description "이지랩 헬스체크 자동 감지 장애" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label "$ISSUE_LABEL" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "🔁 장애 지속 감지 — $FAIL_TIME ([실행 로그]($REPORT_URL) · [대시보드]($PAGES_URL))" 2>/dev/null || true
            echo "기존 이슈 #$EXISTING 에 코멘트 추가 (중복 생성 방지)"
          else
            BODY=$(printf "## 이지랩 헬스체크 실패\n\n**감지 시각:** %s\n\n### 리포트 확인\n- [GitHub Actions 실행 로그](%s)\n- [헬스체크 리포트 페이지](%s)\n\n> 자동 생성된 이슈입니다. 서비스 복구 후 직접 닫아주세요." "$FAIL_TIME" "$REPORT_URL" "$PAGES_URL")
            gh issue create --title "🚨 헬스체크 실패 감지 - $FAIL_TIME" --body "$BODY" --label "$ISSUE_LABEL" 2>/dev/null || true
          fi

      # 검증 런은 Pages 에 배포되지 않으므로 결과를 아티팩트로 받아볼 수 있게 남긴다.
      - name: 검증 런 리포트 artifact 업로드
        if: always() && env.IS_PRODUCTION_RUN != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verification-report
          path: |
            report-status.json
            test-results/api-observation.json
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: 스크린샷 artifact 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 2
