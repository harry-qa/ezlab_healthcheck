name: 이지랩 헬스체크

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 패키지 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 테스트 실행
        run: npx playwright test tests/ezlab.spec.ts --reporter=html
        continue-on-error: true

      - name: 날짜별 리포트 저장
        run: |
          DATE=$(date +'%Y-%m-%d')
          mkdir -p reports/$DATE
          cp -r playwright-report/. reports/$DATE/
          echo "<meta http-equiv='refresh' content='0; url=$DATE/'>" > reports/index.html

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true
