name: 이지랩 헬스체크

on:
  schedule:
    - cron: '0 0 * * *'   # KST 09:00 (UTC 00:00)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 패키지 설치
        run: npm ci

      - name: Playwright 브라우저 설치 (Chromium)
        run: npx playwright install --with-deps chromium

      - name: 테스트 실행
        run: npx playwright test tests/ezlab.spec.ts
        continue-on-error: true

      - name: 날짜별 리포트 저장 및 인덱스 생성
        env:
          TZ: Asia/Seoul
        run: |
          DATE=$(date +'%Y-%m-%d')
          mkdir -p reports/$DATE
          cp -r playwright-report/. reports/$DATE/

          # gh-pages 브랜치에서 기존 날짜 목록 수집
          git fetch origin gh-pages 2>/dev/null || true
          git ls-tree --name-only origin/gh-pages 2>/dev/null \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' > /tmp/dates.txt || true
          echo "$DATE" >> /tmp/dates.txt
          sort -r /tmp/dates.txt | uniq | head -90 > /tmp/all_dates.txt

          # 날짜 목록 인덱스 페이지 생성
          python3 scripts/generate_index.py /tmp/all_dates.txt "$DATE" reports/index.html

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true
