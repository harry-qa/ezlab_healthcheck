name: 헬스체크 실행기

# 헬스체크를 30분마다 실제로 띄우는 실행기.
# GitHub 의 schedule 트리거는 보장이 없다 — 2026-08-27 부터 하루 48회 중 3~9회만 돌았다
# (돈 런은 전부 성공, 드랍된 트리거는 런 기록조차 없음). 그래서 예약에 기대지 않고,
# 이 잡이 깨어 있으면서 매시 17·47분에 헬스체크를 workflow_dispatch 로 직접 띄운다.
#
# - GITHUB_TOKEN 으로 만든 이벤트는 새 런을 만들지 않지만 workflow_dispatch 는 예외라
#   별도 PAT 없이 동작한다(actions: write 필요).
# - 잡 하나는 최대 6시간이라 ~5시간 반 돌고 끝나기 전에 자기 자신을 다시 띄워 연쇄를 잇는다.
# - 동시 실행 그룹이 실행기를 늘 하나로 유지한다: 돌고 있으면 새로 온 건 대기하고, 대기 중인
#   게 있으면 더 새 것이 그걸 대체한다. 그래서 아래 백업 스케줄이 몇 번 와도 연쇄는 하나다.
# - 기다리는 동안 러너를 붙잡고 있는 방식이다. 공개 레포라 비용은 없고, 동시 잡 한도(20) 중 1개를 쓴다.
#
# 멈추는 법: Actions 에서 이 워크플로를 비활성화한다. 돌고 있는 실행기가 다음 슬롯에서
# 상태를 보고 스스로 끝나며 다음 실행기도 띄우지 않는다(최대 30분). 런을 손으로 취소하는 것만으로는
# 대기 중인 백업 실행기가 이어받아 멈추지 않는다.

on:
  workflow_dispatch:
  schedule:
    # 백업 — 연쇄가 끊겼을 때(자기 재호출 실패, 러너 유실) 다시 살린다. 이것도 드랍되지만
    # 하루 몇 번만 와도 충분하다. 연쇄가 살아 있으면 대기열에서 다음 실행기로 대체돼 취소된다.
    - cron: '7,37 * * * *'

permissions:
  actions: write   # workflow_dispatch 호출 · 워크플로 상태와 직전 런 조회

concurrency:
  group: health-ticker
  cancel-in-progress: false

jobs:
  tick:
    # 운영 헬스체크는 main 에서만 띄운다 — 브랜치에서 손으로 돌린 실행기가 운영 런을 만들면 안 된다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_MINUTES: 330      # 이 시간 안에 오는 슬롯만 처리하고 다음 실행기에 넘긴다 (잡 한도 360분)
      SLOT_OFFSET: 1020     # 매 30분 구간의 17분째(=17*60초) — 정시 러시 회피, 기존 cron '17,47' 과 같은 시각
      GAP_ALERT_MINUTES: 60 # 마지막 정기 점검이 이보다 오래됐으면 '감시 공백'으로 알린다
    steps:
      - name: 감시 공백 확인
        # 연쇄가 살아 있으면 실행기는 늘 직전 실행기가 띄운다. 그런데도 마지막 정기 점검이 오래됐다면
        # 연쇄가 끊겼다가(러너 유실·재호출 실패) 이제 살아난 것이다 — 그 사이 헬스체크가 0회였다.
        # 끊긴 '동안'은 알릴 주체가 없으므로, 적어도 살아난 시점에 공백을 알린다.
        continue-on-error: true
        run: |
          last=$(gh run list -R "$REPO" --workflow ezlab-health-check.yml --branch main -L 30 \
                   --json createdAt,displayTitle,event \
                   --jq '[.[] | select(.event == "schedule" or .displayTitle == "이지랩 헬스체크 (정기)")][0].createdAt // empty')
          [ -n "$last" ] || { echo "직전 정기 점검을 찾지 못함 — 건너뜀"; exit 0; }
          # 실행기가 처음 켜지는 때(이전에 끝까지 돈 실행기가 없음)의 공백은 '끊김'이 아니라 도입 전 상태다 — 알리지 않는다.
          prior=$(gh run list -R "$REPO" --workflow health-ticker.yml -L 30 --json databaseId,conclusion \
                    --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.conclusion == \"success\" or .conclusion == \"failure\"))] | length")
          [ "${prior:-0}" -gt 0 ] || { echo "첫 실행기 — 공백 알림 생략"; exit 0; }
          gap=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
          echo "마지막 정기 점검: $last (${gap}분 전)"
          if [ "$gap" -ge "$GAP_ALERT_MINUTES" ]; then
            msg="⚠️ 이지랩 헬스체크 *감시 공백* — 마지막 정기 점검 이후 ${gap}분 동안 점검이 돌지 않았습니다. 실행기가 다시 시작돼 다음 슬롯부터 재개합니다. <${RUN_URL}|실행기 로그>"
            if [ -n "$SLACK_WEBHOOK_URL" ]; then
              python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$msg" \
                | curl -sS -m 15 --retry 3 -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
                || echo "::warning::감시 공백 Slack 발송 실패"
            fi
          fi

      - name: 30분마다 헬스체크 실행
        run: |
          set -u
          dispatch() {
            for i in 1 2 3; do
              gh workflow run "$@" -R "$REPO" --ref main && return 0
              sleep $((i * 20))
            done
            return 1
          }

          deadline=$(( $(date +%s) + RUN_MINUTES * 60 ))
          while :; do
            now=$(date +%s)
            wait=$(( (SLOT_OFFSET - now % 1800 + 1800) % 1800 ))
            if [ $((now + wait)) -gt "$deadline" ]; then break; fi
            echo "다음 슬롯 $(TZ=Asia/Seoul date -d "@$((now + wait))" +'%H:%M') KST 까지 ${wait}초 대기"
            sleep "$wait"
            # 비활성화되면 여기서 멈춘다. 상태를 못 읽으면(API 오류) 멈추지 않는다 — 감시가 끊기는 쪽이 더 나쁘다.
            state=$(gh api "repos/$REPO/actions/workflows/health-ticker.yml" --jq .state 2>/dev/null || echo unknown)
            if [ "$state" != "active" ] && [ "$state" != "unknown" ]; then
              echo "실행기 워크플로가 '$state' — 연쇄를 멈춘다"
              echo "TICKER_STOPPED=1" >> "$GITHUB_ENV"
              exit 0
            fi
            if dispatch ezlab-health-check.yml -f trigger=ticker; then
              echo "헬스체크 실행 요청 — $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S') KST"
            else
              echo "::warning::헬스체크 실행 요청 실패 — 다음 슬롯에서 다시 시도"
            fi
            sleep 60   # 같은 슬롯을 두 번 처리하지 않도록
          done

      - name: 다음 실행기로 연쇄
        # 위 단계가 실패해도 연쇄는 잇는다. 비활성화로 멈춘 경우와 손으로 취소한 경우만 잇지 않는다.
        if: "!cancelled() && env.TICKER_STOPPED != '1'"
        run: |
          for i in 1 2 3; do
            gh workflow run health-ticker.yml -R "$REPO" --ref main && exit 0
            sleep $((i * 20))
          done
          echo "::error::다음 실행기 호출 실패 — 백업 스케줄이 다시 시작할 때까지 헬스체크가 멈춘다"
          msg="🚨 이지랩 헬스체크 *실행기 연쇄 끊김* — 다음 실행기를 띄우지 못했습니다. 백업 스케줄이 살릴 때까지(수 시간 걸릴 수 있음) 헬스체크가 돌지 않습니다. Actions 에서 '헬스체크 실행기'를 수동 실행해 주세요. <${RUN_URL}|실행기 로그>"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$msg" \
              | curl -sS -m 15 --retry 3 -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
              || echo "::warning::연쇄 끊김 Slack 발송 실패"
          fi
          exit 1
